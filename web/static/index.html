<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FEEL.go Playground</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --border: #d0d0d0;
    --muted: #666;
    --error: #b00020;
    --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --bg: #1e1e1e;
      --border: #3a3a3a;
      --muted: #999;
      --error: #ff6b6b;
      --accent: #5b9bff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--fg);
    background: var(--bg);
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; }
  label {
    display: block;
    font-weight: 600;
    font-size: 0.85rem;
    margin-bottom: 0.35rem;
    margin-top: 1.25rem;
  }
  textarea {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
    padding: 0.6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    resize: vertical;
  }
  #expression { height: 4rem; }
  #context { height: 6rem; }
  button {
    margin-top: 1.25rem;
    padding: 0.55rem 1.4rem;
    font-size: 0.95rem;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #result-label { margin-top: 1.5rem; }
  #timing {
    color: var(--muted);
    font-size: 0.8rem;
    margin-left: 0.75rem;
    font-weight: 400;
  }
  pre#result {
    white-space: pre-wrap;
    word-break: break-word;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    min-height: 2.5rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9rem;
  }
  pre#result.error { color: var(--error); }
  kbd {
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0 0.3rem;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<main>
  <h1>FEEL.go Playground</h1>
  <p class="sub">Enter a FEEL expression and an optional context, then evaluate.</p>

  <label for="expression">Expression</label>
  <textarea id="expression" spellcheck="false" placeholder="x + y">1 + 2</textarea>

  <label for="context">Context <span style="font-weight:400;color:var(--muted)">(FEEL context literal, e.g. <code>{x: 1, y: 2}</code>)</span></label>
  <textarea id="context" spellcheck="false" placeholder="{x: 1, y: 2}"></textarea>

  <button id="run">Evaluate <kbd>Ctrl+Enter</kbd></button>

  <label id="result-label" for="result">Result <span id="timing"></span></label>
  <pre id="result"></pre>
</main>

<script>
const expressionEl = document.getElementById("expression");
const contextEl = document.getElementById("context");
const resultEl = document.getElementById("result");
const runBtn = document.getElementById("run");
const timingEl = document.getElementById("timing");

async function evaluate() {
  runBtn.disabled = true;
  resultEl.classList.remove("error");
  resultEl.textContent = "Evaluating…";
  timingEl.textContent = "";

  try {
    const res = await fetch("/api/eval", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        expression: expressionEl.value,
        context: contextEl.value,
      }),
    });
    const data = await res.json();
    if (typeof data.elapsedMs === "number") {
      timingEl.textContent = `(${data.elapsedMs.toFixed(2)} ms)`;
    }
    if (data.error) {
      resultEl.classList.add("error");
      resultEl.textContent = data.error;
    } else {
      resultEl.textContent = JSON.stringify(data.result, null, 2);
    }
  } catch (err) {
    resultEl.classList.add("error");
    resultEl.textContent = String(err);
  } finally {
    runBtn.disabled = false;
  }
}

runBtn.addEventListener("click", evaluate);
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") evaluate();
});
</script>
</body>
</html>
